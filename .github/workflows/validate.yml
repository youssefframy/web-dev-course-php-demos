name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same compose file as on your computer, so the server settings match.
      - name: Start the database
        run: docker compose up -d --wait db dbml

      - name: Apply every schema.sql and seed.sql under modules/ (Unit 2)
        env:
          DB_CMD: docker compose exec -T db mariadb -uroot -proot
        run: scripts/validate.sh

      - name: Rebuild every database from its chain files
        run: ./sql rebuild --all

      - name: Check every exercise (fails only on SQL errors)
        run: ./sql check --all --ci

      - name: Write the progress table
        if: always()
        run: ./sql progress --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check that autograding.json is up to date
        run: |
          ./sql autograding
          git diff --exit-code .github/classroom/autograding.json || {
            echo "autograding.json is out of date. Run ./sql autograding and commit the result."
            exit 1
          }
